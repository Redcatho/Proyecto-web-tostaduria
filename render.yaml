services:
  - type: web
    name: tostaduria-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATABASE_URL
        fromDatabase:
          name: tostaduria-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: APP_VERSION
        value: 0.1.0
      - key: JWT_COOKIE_SAMESITE
        value: None
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: PRODUCT_IMAGE_ENDPOINT
        sync: false
      - key: PRODUCT_IMAGE_BUCKET
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  - type: worker
    name: tostaduria-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: rq worker --url $REDIS_URL tostaduria
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tostaduria-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false

  - type: cron
    name: tostaduria-bcv-rate-sync
    runtime: python
    rootDir: backend
    schedule: "5 13 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app wsgi sync-bcv-rate
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tostaduria-postgres
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: BCV_RATE_URL
        value: https://www.bcv.org.ve/

databases:
  - name: tostaduria-postgres
    plan: basic-256mb
    databaseName: tostaduria
    user: tostaduria
